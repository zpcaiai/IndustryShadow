[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-shadow-sandbox"
version = "0.1.0"
description = "Read-only industrial diagnosis validation sandbox"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "starlette>=1.3.1,<2",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "pyyaml>=6.0,<7",
  "cryptography>=50,<51",
  "pyarrow>=23.0.1,<24",
  "pyOpenSSL>=26,<27",
]

[project.optional-dependencies]
opcua = ["asyncua>=1.1,<2"]
observability = [
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
  "prometheus-client>=0.21,<1",
]
object-storage = ["boto3>=1.35,<2"]
test = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6.120,<7",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "cyclonedx-bom>=7,<8",
  "ruff>=0.9,<1",
  "pyright>=1.1.390,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
strict = ["src"]
reportMissingImports = false
