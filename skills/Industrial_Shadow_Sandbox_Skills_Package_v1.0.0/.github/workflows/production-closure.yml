name: production-closure

on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful production-acceptance workflow run ID containing the signed evidence set
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: industrial-shadow-production-closure
  cancel-in-progress: false

jobs:
  verify-two-person-closure:
    environment: production-closure
    runs-on: [self-hosted, industrial-shadow-acceptance]
    timeout-minutes: 30
    env:
      PYTHONPATH: backend/src
      SHADOW_CLOSURE_SIGNATORIES_FILE: ${{ secrets.SHADOW_CLOSURE_SIGNATORIES_FILE }}
      SHADOW_CANDIDATE_IMAGE: ${{ vars.SHADOW_CANDIDATE_IMAGE }}
      SHADOW_BUILD_DIGEST: ${{ vars.SHADOW_BUILD_DIGEST }}
      SHADOW_SIMULATOR_BUILD_DIGEST: ${{ vars.SHADOW_SIMULATOR_BUILD_DIGEST }}
      SHADOW_PRODUCTION_ENVIRONMENT_DIGEST: ${{ vars.SHADOW_PRODUCTION_ENVIRONMENT_DIGEST }}
      SHADOW_DEPLOYMENT_PLAN_DIGEST: ${{ vars.SHADOW_DEPLOYMENT_PLAN_DIGEST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Install closure verifier dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Download the exact acceptance evidence set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-acceptance-evidence
          path: docs/evidence/batch-24
          github-token: ${{ github.token }}
          run-id: ${{ inputs.acceptance_run_id }}
      - name: Verify signatories against the downloaded approval digest
        run: |
          test -f "$SHADOW_CLOSURE_SIGNATORIES_FILE"
          python tools/build_production_closure.py \
            --evidence-dir docs/evidence/batch-24/production \
            --signatories "$SHADOW_CLOSURE_SIGNATORIES_FILE" \
            --candidate-image "$SHADOW_CANDIDATE_IMAGE" \
            --build-digest "$SHADOW_BUILD_DIGEST" \
            --simulator-build-digest "$SHADOW_SIMULATOR_BUILD_DIGEST" \
            --environment-digest "$SHADOW_PRODUCTION_ENVIRONMENT_DIGEST" \
            --deployment-plan-digest "$SHADOW_DEPLOYMENT_PLAN_DIGEST"
          python tools/check_release_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-closure-evidence
          path: |
            docs/evidence/batch-24/production
            docs/evidence/batch-24/production-deployment
            docs/evidence/batch-24/production-closure-input.json
          if-no-files-found: error
          retention-days: 90
