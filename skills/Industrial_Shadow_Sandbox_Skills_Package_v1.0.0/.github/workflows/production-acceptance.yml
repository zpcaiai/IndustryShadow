name: production-acceptance

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful release-candidate workflow run to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read
  attestations: read

concurrency:
  group: industrial-shadow-production-acceptance
  cancel-in-progress: false

jobs:
  target-gates:
    environment: production-acceptance
    runs-on: [self-hosted, industrial-shadow-acceptance]
    timeout-minutes: 240
    env:
      PYTHONPATH: backend/src:services/simulator/src:services/collector/src:services/edge-gateway/src
      SHADOW_ENVIRONMENT: production
      SHADOW_ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SHADOW_OIDC_ISSUER: ${{ vars.SHADOW_OIDC_ISSUER }}
      SHADOW_OIDC_AUDIENCE: ${{ vars.SHADOW_OIDC_AUDIENCE }}
      SHADOW_OIDC_JWKS_URL: ${{ vars.SHADOW_OIDC_JWKS_URL }}
      SHADOW_OIDC_CLIENT_ID: ${{ vars.SHADOW_OIDC_CLIENT_ID }}
      SHADOW_OIDC_SERVICE_CLIENT_IDS: ${{ vars.SHADOW_OIDC_SERVICE_CLIENT_IDS }}
      SHADOW_OIDC_ID_TOKEN_SIGNING_ALGORITHMS: ${{ vars.SHADOW_OIDC_ID_TOKEN_SIGNING_ALGORITHMS }}
      SHADOW_OIDC_AUTHORIZATION_URL: ${{ vars.SHADOW_OIDC_AUTHORIZATION_URL }}
      SHADOW_OIDC_TOKEN_URL: ${{ vars.SHADOW_OIDC_TOKEN_URL }}
      SHADOW_OIDC_END_SESSION_URL: ${{ vars.SHADOW_OIDC_END_SESSION_URL }}
      SHADOW_PRODUCTION_API_URL: ${{ vars.SHADOW_PRODUCTION_API_URL }}
      SHADOW_PRODUCTION_WEB_URL: ${{ vars.SHADOW_PRODUCTION_WEB_URL }}
      SHADOW_OIDC_PROBE_SECRETS_FILE: ${{ secrets.SHADOW_OIDC_PROBE_SECRETS_FILE }}
      SHADOW_OIDC_BROWSER_SECRETS_FILE: ${{ secrets.SHADOW_OIDC_BROWSER_SECRETS_FILE }}
      SHADOW_OIDC_BROWSER_JOURNEY: web/test-results/production-oidc-journey-${{ github.run_id }}-${{ github.run_attempt }}.json
      SHADOW_OBJECT_STORAGE_BUCKET: ${{ vars.SHADOW_OBJECT_STORAGE_BUCKET }}
      SHADOW_OBJECT_STORAGE_REGION: ${{ vars.SHADOW_OBJECT_STORAGE_REGION }}
      SHADOW_OBJECT_STORAGE_PREFIX: industrial-shadow/production-acceptance
      SHADOW_SNAPSHOT_OBJECT_STORAGE_PREFIX: ${{ vars.SHADOW_SNAPSHOT_OBJECT_STORAGE_PREFIX }}
      SHADOW_OBJECT_STORAGE_KMS_KEY_ID: ${{ vars.SHADOW_OBJECT_STORAGE_KMS_KEY_ID }}
      SHADOW_BACKUP_OBJECT_STORAGE_PREFIX: ${{ vars.SHADOW_BACKUP_OBJECT_STORAGE_PREFIX }}
      SHADOW_AWS_ACCOUNT_ID: ${{ vars.SHADOW_AWS_ACCOUNT_ID }}
      SHADOW_S3_CONTROL_PLANE_CALLER_ARN: ${{ vars.SHADOW_S3_CONTROL_PLANE_CALLER_ARN }}
      SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REPOSITORY: ${{ github.repository }}
      SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REPOSITORY_ID: ${{ github.repository_id }}
      SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REF: ${{ github.ref }}
      SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_ENVIRONMENT: production-acceptance
      SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_WORKFLOW: ${{ github.workflow }}
      SHADOW_KMS_ADMIN_ROLE_ARN: ${{ vars.SHADOW_KMS_ADMIN_ROLE_ARN }}
      SHADOW_AWS_IRSA_OIDC_PROVIDER_ARN: ${{ vars.SHADOW_AWS_IRSA_OIDC_PROVIDER_ARN }}
      SHADOW_REQUIRE_OBJECT_LOCK: "true"
      SHADOW_RESTORE_SOURCE_DATABASE_URL: ${{ secrets.SHADOW_RESTORE_SOURCE_DATABASE_URL }}
      SHADOW_RESTORE_TARGET_DATABASE_URL: ${{ secrets.SHADOW_RESTORE_TARGET_DATABASE_URL }}
      SHADOW_RESTORE_APPLICATION_DATABASE_URL: ${{ secrets.SHADOW_RESTORE_APPLICATION_DATABASE_URL }}
      SHADOW_RESTORE_BACKUP_DATABASE_URL: ${{ secrets.SHADOW_RESTORE_BACKUP_DATABASE_URL }}
      SHADOW_RESTORE_MAXIMUM_SECONDS: ${{ vars.SHADOW_RESTORE_MAXIMUM_SECONDS }}
      SHADOW_RESTORE_MAXIMUM_ARCHIVE_BYTES: ${{ vars.SHADOW_RESTORE_MAXIMUM_ARCHIVE_BYTES }}
      SHADOW_RESTORE_MAXIMUM_RPO_SECONDS: ${{ vars.SHADOW_RESTORE_MAXIMUM_RPO_SECONDS }}
      SHADOW_BACKUP_RESTORE_RECEIPT: ${{ runner.temp }}/industrial-shadow-backup-receipt-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
      SHADOW_BACKUP_JOB_NAMESPACE: ${{ vars.SHADOW_BACKUP_JOB_NAMESPACE }}
      SHADOW_BACKUP_JOB_NAME: ${{ vars.SHADOW_BACKUP_JOB_NAME }}
      SHADOW_BACKUP_JOB_UID: ${{ vars.SHADOW_BACKUP_JOB_UID }}
      SHADOW_POSTGRESQL_MIGRATION_DATABASES_FILE: ${{ secrets.SHADOW_POSTGRESQL_MIGRATION_DATABASES_FILE }}
      SHADOW_POSTGRESQL_MIGRATION_MAXIMUM_SECONDS: ${{ vars.SHADOW_POSTGRESQL_MIGRATION_MAXIMUM_SECONDS }}
      SHADOW_POSTGRESQL_MIGRATION_MAXIMUM_ROWS: ${{ vars.SHADOW_POSTGRESQL_MIGRATION_MAXIMUM_ROWS }}
      SHADOW_MANAGED_POSTGRESQL_PROVIDER: ${{ vars.SHADOW_MANAGED_POSTGRESQL_PROVIDER }}
      SHADOW_MANAGED_POSTGRESQL_INSTANCE_DIGEST: ${{ vars.SHADOW_MANAGED_POSTGRESQL_INSTANCE_DIGEST }}
      SHADOW_MANAGED_POSTGRESQL_SOURCE_RESOURCE_ARN: ${{ vars.SHADOW_MANAGED_POSTGRESQL_SOURCE_RESOURCE_ARN }}
      SHADOW_MANAGED_POSTGRESQL_RESTORE_RESOURCE_ARN: ${{ vars.SHADOW_MANAGED_POSTGRESQL_RESTORE_RESOURCE_ARN }}
      SHADOW_BACKUP_WORKLOAD_IDENTITY_ARN: ${{ vars.SHADOW_BACKUP_WORKLOAD_IDENTITY_ARN }}
      SHADOW_SNAPSHOT_WORKLOAD_IDENTITY_ARN: ${{ vars.SHADOW_SNAPSHOT_WORKLOAD_IDENTITY_ARN }}
      SHADOW_PRODUCTION_S3_CONTROL_PLANE_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_S3_CONTROL_PLANE_CONFIRMATION }}
      SHADOW_PRODUCTION_S3_WORKLOAD_IDENTITY_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_S3_WORKLOAD_IDENTITY_CONFIRMATION }}
      SHADOW_BACKUP_FORBIDDEN_SENTINEL_KEY: ${{ vars.SHADOW_BACKUP_FORBIDDEN_SENTINEL_KEY }}
      SHADOW_SNAPSHOT_FORBIDDEN_SENTINEL_KEY: ${{ vars.SHADOW_SNAPSHOT_FORBIDDEN_SENTINEL_KEY }}
      SHADOW_ALLOW_DESTRUCTIVE_RESTORE_DRILL: "true"
      SHADOW_DATABASE_TENANT_ROLES: shadow_api,shadow_action,shadow_collector
      SHADOW_DATABASE_MAINTENANCE_ROLE: shadow_worker
      SHADOW_DATABASE_BACKUP_ROLE: shadow_backup
      SHADOW_OPCUA_SERVER_CERTIFICATE: ${{ secrets.SHADOW_OPCUA_SERVER_CERTIFICATE }}
      SHADOW_OPCUA_CLIENT_CERTIFICATE: ${{ secrets.SHADOW_OPCUA_CLIENT_CERTIFICATE }}
      SHADOW_OPCUA_NEXT_SERVER_CERTIFICATE: ${{ secrets.SHADOW_OPCUA_NEXT_SERVER_CERTIFICATE }}
      SHADOW_OPCUA_NEXT_CLIENT_CERTIFICATE: ${{ secrets.SHADOW_OPCUA_NEXT_CLIENT_CERTIFICATE }}
      SHADOW_OPCUA_CLIENT_PRIVATE_KEY: ${{ secrets.SHADOW_OPCUA_CLIENT_PRIVATE_KEY }}
      SHADOW_OPCUA_NEXT_CLIENT_PRIVATE_KEY: ${{ secrets.SHADOW_OPCUA_NEXT_CLIENT_PRIVATE_KEY }}
      SHADOW_OPCUA_CA_BUNDLE: ${{ secrets.SHADOW_OPCUA_CA_BUNDLE }}
      SHADOW_OPCUA_CRL_FILE: ${{ secrets.SHADOW_OPCUA_CRL_FILE }}
      SHADOW_OPCUA_APPLICATION_URI: ${{ vars.SHADOW_OPCUA_APPLICATION_URI }}
      SHADOW_OPCUA_CLIENT_APPLICATION_URI: ${{ vars.SHADOW_OPCUA_CLIENT_APPLICATION_URI }}
      SHADOW_CERTIFICATE_FINGERPRINT: ${{ vars.SHADOW_CERTIFICATE_FINGERPRINT }}
      SHADOW_CLIENT_CERTIFICATE_FINGERPRINT: ${{ vars.SHADOW_CLIENT_CERTIFICATE_FINGERPRINT }}
      SHADOW_NEXT_SERVER_CERTIFICATE_FINGERPRINT: ${{ vars.SHADOW_NEXT_SERVER_CERTIFICATE_FINGERPRINT }}
      SHADOW_NEXT_CLIENT_CERTIFICATE_FINGERPRINT: ${{ vars.SHADOW_NEXT_CLIENT_CERTIFICATE_FINGERPRINT }}
      SHADOW_OPCUA_SECURITY_STRING: ${{ secrets.SHADOW_OPCUA_SECURITY_STRING }}
      SHADOW_OPCUA_PROBE_CONFIG: ${{ vars.SHADOW_OPCUA_PROBE_CONFIG }}
      SHADOW_NETWORK_PROBE_CONFIG: ${{ vars.SHADOW_NETWORK_PROBE_CONFIG }}
      SHADOW_PRODUCTION_NETWORK_PROBE_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_NETWORK_PROBE_CONFIRMATION }}
      SHADOW_LOAD_PROBE_CONFIG: ${{ vars.SHADOW_LOAD_PROBE_CONFIG }}
      SHADOW_LOAD_PROBE_SECRETS_FILE: ${{ secrets.SHADOW_LOAD_PROBE_SECRETS_FILE }}
      SHADOW_SECURITY_ASSURANCE_BUNDLE: ${{ secrets.SHADOW_SECURITY_ASSURANCE_BUNDLE }}
      SHADOW_PRIVACY_ASSURANCE_BUNDLE: ${{ secrets.SHADOW_PRIVACY_ASSURANCE_BUNDLE }}
      SHADOW_ACCESSIBILITY_ASSURANCE_BUNDLE: ${{ secrets.SHADOW_ACCESSIBILITY_ASSURANCE_BUNDLE }}
      SHADOW_DOCKER_SCOUT_CREDENTIALS_FILE: ${{ secrets.SHADOW_DOCKER_SCOUT_CREDENTIALS_FILE }}
      SHADOW_IMAGE_REGISTRY_CREDENTIALS_FILE: ${{ secrets.SHADOW_IMAGE_REGISTRY_CREDENTIALS_FILE }}
      SHADOW_CONTAINER_SCAN_REPORT: docs/evidence/batch-24/production/container-scan.sarif.json
      SHADOW_KUBERNETES_DRILL_CONFIG: ${{ vars.SHADOW_KUBERNETES_DRILL_CONFIG }}
      SHADOW_CHAOS_DRILL_CONFIG: ${{ vars.SHADOW_CHAOS_DRILL_CONFIG }}
      SHADOW_KUBERNETES_NETWORK_CONTEXT: ${{ vars.SHADOW_KUBERNETES_NETWORK_CONTEXT }}
      SHADOW_KUBERNETES_STORAGE_CONTEXT: ${{ vars.SHADOW_KUBERNETES_STORAGE_CONTEXT }}
      SHADOW_KUBERNETES_CHAOS_CONTEXT: ${{ vars.SHADOW_KUBERNETES_CHAOS_CONTEXT }}
      SHADOW_KUBERNETES_ROLLBACK_CONTEXT: ${{ vars.SHADOW_KUBERNETES_ROLLBACK_CONTEXT }}
      SHADOW_DRILL_DATABASE_URL: ${{ secrets.SHADOW_DRILL_DATABASE_URL }}
      SHADOW_PRODUCTION_DRILL_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_DRILL_CONFIRMATION }}
      SHADOW_PRODUCTION_CHAOS_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_CHAOS_CONFIRMATION }}
      SHADOW_PRODUCTION_ENVIRONMENT_DIGEST: ${{ vars.SHADOW_PRODUCTION_ENVIRONMENT_DIGEST }}
      SHADOW_DEPLOYMENT_PLAN_DIGEST: ${{ vars.SHADOW_DEPLOYMENT_PLAN_DIGEST }}
      SHADOW_DEPLOYMENT_PLAN_BUNDLE: ${{ secrets.SHADOW_DEPLOYMENT_PLAN_BUNDLE }}
      SHADOW_PRODUCTION_DEPLOYMENT_PLAN: docs/evidence/batch-24/production-deployment/deployment-plan.json
      SHADOW_FORMAL_BENCHMARK_BUNDLE: ${{ secrets.SHADOW_FORMAL_BENCHMARK_BUNDLE }}
      SHADOW_ASSESSOR_TRUST_STORE: docs/evidence/batch-24/production/assessor-trust-store.json
      SHADOW_ASSESSOR_TRUST_STORE_SOURCE: ${{ secrets.SHADOW_ASSESSOR_TRUST_STORE }}
      SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION: docs/evidence/batch-24/production/assessor-trust-root-attestation.json
      SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION_SOURCE: ${{ secrets.SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION }}
      SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY: docs/evidence/batch-24/production/assessor-trust-root-public-key.pem
      SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY_SOURCE: ${{ secrets.SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY }}
      SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256: ${{ vars.SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256 }}
      SHADOW_FORMAL_BENCHMARK_REPORT: docs/evidence/batch-24/production/formal-benchmark/report.json
      SHADOW_SECURITY_ASSURANCE_REPORT: docs/evidence/batch-24/production/security-assurance/report.json
      SHADOW_PRIVACY_ASSURANCE_REPORT: docs/evidence/batch-24/production/privacy-assurance/report.json
      SHADOW_ACCESSIBILITY_ASSURANCE_REPORT: docs/evidence/batch-24/production/accessibility-assurance/report.json
      SHADOW_RELEASE_CANDIDATE_MANIFEST: docs/evidence/batch-24/production/supply-chain/release-candidate.json
      SHADOW_RELEASE_CANDIDATE_BUNDLE: docs/evidence/batch-24/production/supply-chain/candidate-manifest.attestation.json
      SHADOW_POSTGRESQL_MIGRATION_MANIFEST: docs/evidence/batch-24/production/supply-chain/postgresql-migration-manifest.json
    steps:
      - name: Resolve the selected release workflow attempt
        id: release-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_record="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq '[.conclusion,.head_sha,.path,.head_repository.full_name,.event,.run_attempt] | @tsv')"
          IFS=$'\t' read -r conclusion source_revision workflow_path source_repository event run_attempt <<< "$run_record"
          test "$conclusion" = success
          test "${workflow_path%%@*}" = .github/workflows/release.yml
          test "$source_repository" = "$GITHUB_REPOSITORY"
          case "$event" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
      - name: Download immutable release candidate from the selected attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-release-candidate-${{ inputs.release_run_id }}-${{ steps.release-run.outputs.run_attempt }}
          path: ${{ runner.temp }}/industrial-shadow-release-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
      - name: Bind acceptance checkout to the immutable release candidate
        id: candidate
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.release-run.outputs.run_attempt }}
          SOURCE_REVISION: ${{ steps.release-run.outputs.source_revision }}
          CANDIDATE_MANIFEST: ${{ runner.temp }}/industrial-shadow-release-candidate/release-candidate.json
        run: |
          run_attempt="$RELEASE_RUN_ATTEMPT"
          source_revision="$SOURCE_REVISION"
          python3 - "$CANDIDATE_MANIFEST" "$GITHUB_REPOSITORY" "$RELEASE_RUN_ID" "$source_revision" "$run_attempt" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path, repository, run_id, revision, run_attempt = sys.argv[1:]
          value = json.loads(Path(path).read_text(encoding="utf-8"))
          if (
              value.get("repository") != repository
              or value.get("release_run_id") != run_id
              or value.get("release_run_attempt") != int(run_attempt)
              or value.get("source_revision") != revision
              or not re.fullmatch(r"[a-f0-9]{40}", revision)
          ):
              raise SystemExit("release candidate does not match the selected workflow run")
          PY
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.candidate.outputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Install production probe dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Validate and export immutable release coordinates
        run: |
          python tools/export_release_candidate.py \
            --manifest "${{ runner.temp }}/industrial-shadow-release-candidate/release-candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ inputs.release_run_id }}" \
            --run-attempt "${{ steps.candidate.outputs.run_attempt }}" \
            --stage-dir docs/evidence/batch-24/production/supply-chain \
            --github-env "$GITHUB_ENV"
      - name: Stage signed target reports and public signer trust store
        run: |
          python tools/stage_signed_bundle.py --source "$SHADOW_FORMAL_BENCHMARK_BUNDLE" --destination docs/evidence/batch-24/production/formal-benchmark --manifest report.json --kind benchmark
          python tools/stage_signed_bundle.py --source "$SHADOW_SECURITY_ASSURANCE_BUNDLE" --destination docs/evidence/batch-24/production/security-assurance --manifest report.json --kind assurance
          python tools/stage_signed_bundle.py --source "$SHADOW_PRIVACY_ASSURANCE_BUNDLE" --destination docs/evidence/batch-24/production/privacy-assurance --manifest report.json --kind assurance
          python tools/stage_signed_bundle.py --source "$SHADOW_ACCESSIBILITY_ASSURANCE_BUNDLE" --destination docs/evidence/batch-24/production/accessibility-assurance --manifest report.json --kind assurance
          python tools/stage_signed_bundle.py --source "$SHADOW_DEPLOYMENT_PLAN_BUNDLE" --destination docs/evidence/batch-24/production-deployment --manifest deployment-plan.json --kind deployment
          test -f "$SHADOW_ASSESSOR_TRUST_STORE_SOURCE"
          test ! -L "$SHADOW_ASSESSOR_TRUST_STORE_SOURCE"
          install -m 0444 "$SHADOW_ASSESSOR_TRUST_STORE_SOURCE" "$SHADOW_ASSESSOR_TRUST_STORE"
          test -f "$SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION_SOURCE"
          test ! -L "$SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION_SOURCE"
          install -m 0444 "$SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION_SOURCE" "$SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION"
          test -f "$SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY_SOURCE"
          test ! -L "$SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY_SOURCE"
          install -m 0444 "$SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY_SOURCE" "$SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY"
      - name: Collect the signed immutable backup receipt from its exact completed Job
        run: |
          receipt_directory="${SHADOW_BACKUP_RESTORE_RECEIPT%/*}"
          test ! -e "$receipt_directory"
          install -d -m 0700 "$receipt_directory"
          python tools/collect_production_backup_receipt.py \
            --context "$SHADOW_KUBERNETES_STORAGE_CONTEXT" \
            --namespace "$SHADOW_BACKUP_JOB_NAMESPACE" \
            --job-name "$SHADOW_BACKUP_JOB_NAME" \
            --job-uid "$SHADOW_BACKUP_JOB_UID" \
            --candidate-image "$SHADOW_CANDIDATE_IMAGE" \
            --build-digest "$SHADOW_BUILD_DIGEST" \
            --simulator-build-digest "$SHADOW_SIMULATOR_BUILD_DIGEST" \
            --environment-digest "$SHADOW_PRODUCTION_ENVIRONMENT_DIGEST" \
            --deployment-plan-digest "$SHADOW_DEPLOYMENT_PLAN_DIGEST" \
            --formal-report "$SHADOW_FORMAL_BENCHMARK_REPORT" \
            --deployment-plan "$SHADOW_PRODUCTION_DEPLOYMENT_PLAN" \
            --trust-store "$SHADOW_ASSESSOR_TRUST_STORE" \
            --trust-root-attestation "$SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION" \
            --trust-root-public-key "$SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY" \
            --trust-root-key-sha256 "$SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256" \
            --output "$SHADOW_BACKUP_RESTORE_RECEIPT"
      - name: Install locked browser-journey dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Prepare pristine run-bound OIDC browser journey target
        run: |
          python - <<'PY'
          import os
          import stat
          from pathlib import Path

          run_id = os.environ["SHADOW_ACCEPTANCE_RUN_ID"]
          configured = Path(os.environ["SHADOW_OIDC_BROWSER_JOURNEY"])
          expected = Path("web", "test-results", f"production-oidc-journey-{run_id}.json")
          if configured != expected:
              raise SystemExit("OIDC journey output is not run-attempt bound")
          web = Path("web")
          if web.is_symlink() or not web.is_dir():
              raise SystemExit("web root is unsafe")
          parent = expected.parent
          try:
              parent.mkdir(mode=0o700)
          except FileExistsError:
              pass
          parent_stat = parent.lstat()
          if (
              not stat.S_ISDIR(parent_stat.st_mode)
              or parent.is_symlink()
              or parent_stat.st_uid != os.geteuid()
          ):
              raise SystemExit("OIDC journey output directory is unsafe")
          parent.chmod(0o700)
          if expected.exists() or expected.is_symlink():
              target_stat = expected.lstat()
              if stat.S_ISDIR(target_stat.st_mode):
                  raise SystemExit("OIDC journey output target is a directory")
              expected.unlink()
          if expected.exists() or expected.is_symlink():
              raise SystemExit("OIDC journey output target is not pristine")
          PY
      - name: Verify release provenance, SBOMs, and candidate manifest attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/production_gate.py supply_chain --output docs/evidence/batch-24/production/supply_chain.json
      - name: Independently recompute formal 150-Episode exact-bundle Gate
        run: python tools/production_gate.py benchmark_150 --output docs/evidence/batch-24/production/benchmark_150.json
      - name: Resolve the partition-exact AWS STS audience
        id: caller-sts
        run: |
          test "$GITHUB_REF" = refs/heads/main
          case "$SHADOW_OBJECT_STORAGE_REGION" in
            cn-*) audience=sts.amazonaws.com.cn ;;
            us-gov-*|*) audience=sts.amazonaws.com ;;
          esac
          echo "audience=$audience" >> "$GITHUB_OUTPUT"
      - name: Assume the sealed AWS control-plane caller with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-region: ${{ env.SHADOW_OBJECT_STORAGE_REGION }}
          role-to-assume: ${{ env.SHADOW_S3_CONTROL_PLANE_CALLER_ARN }}
          role-session-name: industrial-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          audience: ${{ steps.caller-sts.outputs.audience }}
          role-skip-session-tagging: true
          unset-current-credentials: true
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.SHADOW_AWS_ACCOUNT_ID }}
      - name: Collect exact live AWS storage policy digests read-only
        run: |
          fragment="$RUNNER_TEMP/aws-storage-policy-target-${SHADOW_ACCEPTANCE_RUN_ID}.json"
          test ! -e "$fragment"
          python tools/collect_aws_storage_policy_digests.py \
            --bucket "$SHADOW_OBJECT_STORAGE_BUCKET" \
            --region "$SHADOW_OBJECT_STORAGE_REGION" \
            --account-id "$SHADOW_AWS_ACCOUNT_ID" \
            --kms-key-arn "$SHADOW_OBJECT_STORAGE_KMS_KEY_ID" \
            --control-plane-caller-arn "$SHADOW_S3_CONTROL_PLANE_CALLER_ARN" \
            --kms-admin-role-arn "$SHADOW_KMS_ADMIN_ROLE_ARN" \
            --oidc-provider-arn "$SHADOW_AWS_IRSA_OIDC_PROVIDER_ARN" \
            --acceptance-prefix "$SHADOW_OBJECT_STORAGE_PREFIX" \
            --backup-prefix "$SHADOW_BACKUP_OBJECT_STORAGE_PREFIX" \
            --snapshot-prefix "$SHADOW_SNAPSHOT_OBJECT_STORAGE_PREFIX" \
            --backup-sentinel-key "$SHADOW_BACKUP_FORBIDDEN_SENTINEL_KEY" \
            --snapshot-sentinel-key "$SHADOW_SNAPSHOT_FORBIDDEN_SENTINEL_KEY" \
            --caller-trust-repository "$SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REPOSITORY" \
            --caller-trust-repository-owner-id "$SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REPOSITORY_OWNER_ID" \
            --caller-trust-repository-id "$SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REPOSITORY_ID" \
            --caller-trust-ref "$SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_REF" \
            --caller-trust-environment "$SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_ENVIRONMENT" \
            --caller-trust-workflow "$SHADOW_S3_CONTROL_PLANE_CALLER_TRUST_WORKFLOW" \
            --backup-role-arn "$SHADOW_BACKUP_WORKLOAD_IDENTITY_ARN" \
            --snapshot-role-arn "$SHADOW_SNAPSHOT_WORKLOAD_IDENTITY_ARN" \
            --namespace "$SHADOW_BACKUP_JOB_NAMESPACE" > "$fragment"
          install -m 0444 "$fragment" docs/evidence/batch-24/production/aws-storage-policy-target.json
      - name: Fail-closed non-mutating production input preflight
        run: python tools/production_gate.py preflight --output docs/evidence/batch-24/production/preflight.json
      - name: Authorize all live production probes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("docs/evidence/batch-24/production/preflight.json"),
              Path("docs/evidence/batch-24/production/supply_chain.json"),
              Path("docs/evidence/batch-24/production/benchmark_150.json"),
          ]
          values = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          if any(
              value.get("status") != "PASSED"
              or value.get("limitations")
              or value.get("schema_version") != 2
              for value in values
          ):
              raise SystemExit("production prerequisite gate is not closure-eligible")
          if len({value.get("acceptance_run_id") for value in values}) != 1:
              raise SystemExit("production prerequisite gates use different acceptance runs")
          if len({value.get("release_digest") for value in values}) != 1:
              raise SystemExit("production prerequisite gates use different releases")
          PY
      - name: Execute bundled local diagnostic benchmark
        run: python tools/production_gate.py benchmark_local --output docs/evidence/batch-24/production/benchmark_local.json --summary docs/evidence/batch-24/production/benchmark-local-summary.json
      - name: Execute six-persona production OIDC PKCE and logout journey
        working-directory: web
        env:
          SHADOW_E2E_PRODUCTION_URL: ${{ vars.SHADOW_PRODUCTION_WEB_URL }}
          SHADOW_E2E_EXECUTABLE: ${{ vars.SHADOW_E2E_EXECUTABLE }}
        run: npm run test:e2e -- production-oidc.spec.ts
        continue-on-error: true
      - name: Verify fresh live OIDC journey and persona RBAC
        run: python tools/production_gate.py oidc --output docs/evidence/batch-24/production/oidc.json
        continue-on-error: true
      - name: Execute fresh and N-1 managed PostgreSQL migration drills
        run: python tools/production_gate.py postgresql_migration --output docs/evidence/batch-24/production/postgresql_migration.json
        continue-on-error: true
      - name: Execute managed PostgreSQL restore drill
        run: python tools/production_gate.py backup_restore --output docs/evidence/batch-24/production/backup_restore.json
        continue-on-error: true
      - name: Verify live NetworkPolicy enforcement before target-Pod probes
        run: python tools/production_gate.py network_policy --output docs/evidence/batch-24/production/network_policy.json
      - name: Verify S3 KMS controls and target-Pod workload identities
        run: python tools/production_gate.py s3 --output docs/evidence/batch-24/production/s3.json
        continue-on-error: true
      - name: Verify external CA and revocation material
        run: python tools/production_gate.py external_ca --output docs/evidence/batch-24/production/external_ca.json
        continue-on-error: true
      - name: Verify real OT read-only interoperability
        run: python tools/production_gate.py real_ot --output docs/evidence/batch-24/production/real_ot.json
        continue-on-error: true
      - name: Scan both immutable release images with Docker Scout
        run: python tools/production_gate.py container_scan --output docs/evidence/batch-24/production/container_scan.json
        continue-on-error: true
      - name: Execute measured target load
        run: python tools/production_gate.py performance --output docs/evidence/batch-24/production/performance.json
        continue-on-error: true
      - name: Execute controlled pod-loss recovery drill
        run: python tools/production_gate.py resilience --output docs/evidence/batch-24/production/resilience.json
        continue-on-error: true
      - name: Execute candidate upgrade and exact rollback
        run: python tools/production_gate.py upgrade_rollback --output docs/evidence/batch-24/production/upgrade_rollback.json
        continue-on-error: true
      - name: Import signed external security assessment
        run: python tools/production_gate.py security --output docs/evidence/batch-24/production/security.json
        continue-on-error: true
      - name: Import signed external privacy assessment
        run: python tools/production_gate.py privacy --output docs/evidence/batch-24/production/privacy.json
        continue-on-error: true
      - name: Import signed independent human accessibility assessment
        run: python tools/production_gate.py accessibility --output docs/evidence/batch-24/production/accessibility.json
        continue-on-error: true
      - name: Build approval request bound to this exact evidence set
        run: |
          python tools/build_production_closure.py \
            --evidence-dir docs/evidence/batch-24/production \
            --candidate-image "$SHADOW_CANDIDATE_IMAGE" \
            --build-digest "$SHADOW_BUILD_DIGEST" \
            --simulator-build-digest "$SHADOW_SIMULATOR_BUILD_DIGEST" \
            --environment-digest "$SHADOW_PRODUCTION_ENVIRONMENT_DIGEST" \
            --deployment-plan-digest "$SHADOW_DEPLOYMENT_PLAN_DIGEST" \
            --trust-root-attestation "$SHADOW_ASSESSOR_TRUST_ROOT_ATTESTATION" \
            --trust-root-public-key "$SHADOW_ASSESSOR_TRUST_ROOT_PUBLIC_KEY" \
            --trust-root-key-sha256 "$SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256" \
            --approval-request docs/evidence/batch-24/production/approval-request.json || test $? -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/evidence/batch-24/production
            docs/evidence/batch-24/production-deployment
          if-no-files-found: error
          retention-days: 30
