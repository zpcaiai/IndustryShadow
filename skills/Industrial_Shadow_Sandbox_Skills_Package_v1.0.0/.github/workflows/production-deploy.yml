name: production-deploy

on:
  workflow_dispatch:
    inputs:
      closure_run_id:
        description: Successful production-closure run ID for the exact approved release
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: industrial-shadow-production-deploy
  cancel-in-progress: false

jobs:
  deploy-closure-bound-release:
    environment: production-deployment
    runs-on: [self-hosted, industrial-shadow-deployment]
    timeout-minutes: 60
    env:
      PYTHONPATH: backend/src
      SHADOW_PRODUCTION_DEPLOYMENT_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_DEPLOYMENT_CONFIRMATION }}
      SHADOW_PRODUCTION_DEPLOYMENT_PLAN: docs/evidence/batch-24/production-deployment/deployment-plan.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Install release verifier dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Download the exact signed closure and deployment plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-closure-evidence
          path: docs/evidence/batch-24
          github-token: ${{ github.token }}
          run-id: ${{ inputs.closure_run_id }}
      - name: Verify closure and publish the phased Kubernetes manifests
        run: |
          python tools/deploy_production_kubernetes.py \
            --plan "$SHADOW_PRODUCTION_DEPLOYMENT_PLAN" \
            --output docs/evidence/batch-24/production-deployment/deployment-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-deployment-evidence
          path: docs/evidence/batch-24/production-deployment
          if-no-files-found: error
          retention-days: 90
