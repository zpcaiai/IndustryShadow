name: production-deploy

on:
  workflow_dispatch:
    inputs:
      closure_run_id:
        description: Successful production-closure run ID for the exact approved release
        required: true
        type: string
      operation:
        description: Deploy candidate or resume the closure-bound prior-bundle rollback
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: industrial-shadow-production-deploy
  cancel-in-progress: false

jobs:
  deploy-closure-bound-release:
    environment: production-deployment
    runs-on: [self-hosted, industrial-shadow-deployment]
    timeout-minutes: 60
    env:
      PYTHONPATH: backend/src
      SHADOW_PRODUCTION_DEPLOYMENT_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_DEPLOYMENT_CONFIRMATION }}
      SHADOW_KUBERNETES_CONTEXT: ${{ vars.SHADOW_KUBERNETES_CONTEXT }}
      SHADOW_PRODUCTION_DEPLOYMENT_PLAN: docs/evidence/batch-24/production-deployment/deployment-plan.json
      SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256: ${{ vars.SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256 }}
    steps:
      - name: Inspect exact closure before selecting verifier source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-closure-evidence
          path: ${{ runner.temp }}/industrial-shadow-closure
          github-token: ${{ github.token }}
          run-id: ${{ inputs.closure_run_id }}
      - name: Bind deployment source to the signed release candidate
        id: closure-source
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_RUN_ID: ${{ inputs.closure_run_id }}
          CANDIDATE_MANIFEST: ${{ runner.temp }}/industrial-shadow-closure/production/supply-chain/release-candidate.json
        run: |
          [[ "$CLOSURE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_record="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CLOSURE_RUN_ID" --jq '[.conclusion,.path,.head_repository.full_name,.event,.run_attempt] | @tsv')"
          IFS=$'\t' read -r conclusion workflow_path source_repository event run_attempt <<< "$run_record"
          test "$conclusion" = success
          test "$workflow_path" = .github/workflows/production-closure.yml
          test "$source_repository" = "$GITHUB_REPOSITORY"
          test "$event" = workflow_dispatch
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          source_revision="$(python3 - "$CANDIDATE_MANIFEST" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          candidate = json.load(open(sys.argv[1]))
          payload = {**candidate, "manifest_digest": ""}
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          if (
              candidate.get("manifest_digest") != hashlib.sha256(encoded.encode()).hexdigest()
              or candidate.get("repository") != os.environ["GITHUB_REPOSITORY"]
              or not re.fullmatch(r"[1-9][0-9]*", str(candidate.get("release_run_id", "")))
              or isinstance(candidate.get("release_run_attempt"), bool)
              or not isinstance(candidate.get("release_run_attempt"), int)
              or candidate.get("release_run_attempt") < 1
          ):
              raise SystemExit("candidate manifest digest is invalid")
          print(candidate["source_revision"])
          PY
          )"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]]
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.closure-source.outputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Install release verifier dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Download the exact signed closure and deployment plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-closure-evidence
          path: docs/evidence/batch-24
          github-token: ${{ github.token }}
          run-id: ${{ inputs.closure_run_id }}
      - name: Verify closure and publish the phased Kubernetes manifests
        if: inputs.operation == 'deploy'
        run: |
          python tools/deploy_production_kubernetes.py \
            --plan "$SHADOW_PRODUCTION_DEPLOYMENT_PLAN" \
            --journal docs/evidence/batch-24/production-deployment/deployment-journal.json \
            --output docs/evidence/batch-24/production-deployment/deployment-evidence.json
      - name: Resume and verify closure-bound prior-bundle rollback
        if: inputs.operation == 'rollback'
        run: |
          python tools/deploy_production_kubernetes.py \
            --rollback-only \
            --plan "$SHADOW_PRODUCTION_DEPLOYMENT_PLAN" \
            --journal docs/evidence/batch-24/production-deployment/deployment-journal.json \
            --output docs/evidence/batch-24/production-deployment/rollback-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-deployment-evidence
          path: docs/evidence/batch-24/production-deployment
          if-no-files-found: error
          retention-days: 90
