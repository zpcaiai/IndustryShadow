# Generated root entrypoint; edit the package template and sync deliberately.
# Template: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/.github/workflows/recertification.yml
name: scheduled-closure-revalidation

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      closure_run_id:
        description: Approved production closure run to revalidate without claiming a new live acceptance
        required: false
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0

jobs:
  revalidate-protected-closure:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: backend/src:services/simulator/src:services/collector/src:services/edge-gateway/src
      SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256: ${{ vars.SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256 }}
    steps:
      - name: Resolve protected closure run
        id: closure
        env:
          REQUESTED_RUN_ID: ${{ inputs.closure_run_id || vars.SHADOW_ACTIVE_PRODUCTION_CLOSURE_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          [[ "$REQUESTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_record="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID" --jq '[.conclusion,.head_sha,.path,.head_repository.full_name,.event,.run_attempt,.run_started_at,.updated_at] | @tsv')"
          IFS=$'\t' read -r conclusion source_revision workflow_path source_repository event run_attempt run_started_at run_updated_at <<< "$run_record"
          test "$conclusion" = success
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]]
          test "${workflow_path%%@*}" = .github/workflows/production-closure.yml
          test "$source_repository" = "$GITHUB_REPOSITORY"
          test "$event" = workflow_dispatch
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          artifact_expected_name="production-closure-evidence-$REQUESTED_RUN_ID-$run_attempt"
          artifact_record="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID/artifacts?name=$artifact_expected_name&per_page=100" --jq '[.total_count,(.artifacts | length),.artifacts[0].id,.artifacts[0].name,.artifacts[0].expired,.artifacts[0].created_at,.artifacts[0].workflow_run.id,.artifacts[0].workflow_run.head_sha,.artifacts[0].digest] | @tsv')"
          IFS=$'\t' read -r artifact_total artifact_count artifact_id artifact_name artifact_expired artifact_created_at artifact_run_id artifact_head_sha artifact_digest <<< "$artifact_record"
          test "$artifact_total" = 1
          test "$artifact_count" = 1
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          test "$artifact_name" = "$artifact_expected_name"
          test "$artifact_expired" = false
          test "$artifact_run_id" = "$REQUESTED_RUN_ID"
          test "$artifact_head_sha" = "$source_revision"
          [[ "$artifact_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 - "$run_started_at" "$run_updated_at" "$artifact_created_at" <<'PY'
          import datetime as dt
          import sys

          started, completed, created = (
              dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              for value in sys.argv[1:]
          )
          if any(value.tzinfo is None for value in (started, completed, created)):
              raise SystemExit("closure artifact timestamps must be timezone-aware")
          if not started <= created <= completed:
              raise SystemExit("closure artifact does not belong to the latest run attempt")
          PY
          echo "run_id=$REQUESTED_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${artifact_digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_expected_name" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.closure.outputs.artifact_name }}
          path: ${{ runner.temp }}/industrial-shadow-closure-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.closure.outputs.run_id }}
      - name: Resolve signed source revision
        id: source
        env:
          CANDIDATE_MANIFEST: ${{ runner.temp }}/industrial-shadow-closure-${{ github.run_id }}-${{ github.run_attempt }}/production/supply-chain/release-candidate.json
          EXPECTED_SOURCE_REVISION: ${{ steps.closure.outputs.source_revision }}
        working-directory: ${{ github.workspace }}
        run: |
          source_revision="$(python3 - "$CANDIDATE_MANIFEST" "$EXPECTED_SOURCE_REVISION" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          candidate = json.load(open(sys.argv[1]))
          expected_source_revision = sys.argv[2]
          payload = {**candidate, "manifest_digest": ""}
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          if (
              candidate.get("manifest_digest") != hashlib.sha256(encoded.encode()).hexdigest()
              or candidate.get("repository") != os.environ["GITHUB_REPOSITORY"]
              or not re.fullmatch(r"[1-9][0-9]*", str(candidate.get("release_run_id", "")))
              or isinstance(candidate.get("release_run_attempt"), bool)
              or not isinstance(candidate.get("release_run_attempt"), int)
              or candidate.get("release_run_attempt") < 1
              or candidate.get("source_revision") != expected_source_revision
          ):
              raise SystemExit("candidate manifest digest is invalid")
          print(candidate["source_revision"])
          PY
          )"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]]
          test "$source_revision" = "$EXPECTED_SOURCE_REVISION"
          echo "revision=$source_revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Initialize honest revalidation status
        env:
          CLOSURE_RUN_ID: ${{ steps.closure.outputs.run_id }}
          CLOSURE_RUN_ATTEMPT: ${{ steps.closure.outputs.run_attempt }}
          CLOSURE_ARTIFACT_ID: ${{ steps.closure.outputs.artifact_id }}
          CLOSURE_ARTIFACT_SHA256: ${{ steps.closure.outputs.artifact_sha256 }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          mkdir -p artifacts/closure-revalidation
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path("artifacts/closure-revalidation/scheduled-closure-revalidation.json")
          payload = {
              "schema_version": 1,
              "operation": "scheduled_closure_revalidation",
              "source_closure_run_id": os.environ["CLOSURE_RUN_ID"],
              "source_closure_run_attempt": os.environ["CLOSURE_RUN_ATTEMPT"],
              "source_closure_artifact_id": os.environ["CLOSURE_ARTIFACT_ID"],
              "source_closure_artifact_sha256": os.environ["CLOSURE_ARTIFACT_SHA256"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "closure_revalidation": "NOT_RUN",
              "static_suite_outcome": "NOT_RUN",
              "closure_evidence_outcome": "NOT_RUN",
              "live_production_recertification": "NOT_RUN",
              "live_recertification_limitation": "fresh_production_acceptance_closure_and_human_signoff_not_executed",
              "required_live_action": "dispatch a fresh release candidate, production acceptance, and signed production closure",
              "updated_at": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
              "digest": "",
          }
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          payload["digest"] = hashlib.sha256(encoded.encode()).hexdigest()
          output.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n")
          PY
      - name: Re-run deterministic and policy suites for closure revalidation
        id: static-suites
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          make lint typecheck test validate
      - name: Download the protected closure directly into the verifier evidence root
        id: closure-download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.closure.outputs.artifact_name }}
          path: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/docs/evidence/batch-24
          github-token: ${{ github.token }}
          run-id: ${{ steps.closure.outputs.run_id }}
      - name: Re-evaluate the protected closure without bypass
        id: closure-check
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: GITHUB_SHA="$EXPECTED_SOURCE_REVISION" python tools/check_release_evidence.py
      - name: Mark closure revalidation complete without claiming live recertification
        if: always()
        env:
          STATIC_SUITE_OUTCOME: ${{ steps.static-suites.outcome }}
          CLOSURE_DOWNLOAD_OUTCOME: ${{ steps.closure-download.outcome }}
          CLOSURE_CHECK_OUTCOME: ${{ steps.closure-check.outcome }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/closure-revalidation/scheduled-closure-revalidation.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          claimed_digest = payload.get("digest", "")
          payload["digest"] = ""
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          if claimed_digest != hashlib.sha256(encoded.encode()).hexdigest():
              raise SystemExit("revalidation status digest is invalid")
          if (
              payload.get("operation") != "scheduled_closure_revalidation"
              or payload.get("live_production_recertification") != "NOT_RUN"
          ):
              raise SystemExit("live recertification boundary is invalid")
          static_outcome = os.environ["STATIC_SUITE_OUTCOME"]
          evidence_outcomes = {
              os.environ["CLOSURE_DOWNLOAD_OUTCOME"],
              os.environ["CLOSURE_CHECK_OUTCOME"],
          }
          payload["static_suite_outcome"] = static_outcome.upper()
          payload["closure_evidence_outcome"] = (
              "PASSED" if evidence_outcomes == {"success"} else "FAILED"
          )
          payload["closure_revalidation"] = (
              "PASSED"
              if static_outcome == "success" and evidence_outcomes == {"success"}
              else "FAILED"
          )
          payload["live_production_recertification"] = "NOT_RUN"
          payload["updated_at"] = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          payload["digest"] = hashlib.sha256(encoded.encode()).hexdigest()
          path.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n")
          PY
      - name: State the live production boundary
        if: always()
        run: |
          {
            echo '### Scheduled closure revalidation'
            echo ''
            echo '- Live production recertification: **NOT_RUN**'
            echo '- A fresh production acceptance, external review, human sign-off, and closure are still required.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish closure revalidation status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-closure-revalidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/artifacts/closure-revalidation/scheduled-closure-revalidation.json
          if-no-files-found: error
          retention-days: 90
