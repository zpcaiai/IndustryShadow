# Generated root entrypoint; edit the package template and sync deliberately.
# Template: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/.github/workflows/production-deploy.yml
name: production-deploy

on:
  workflow_dispatch:
    inputs:
      closure_run_id:
        description: Successful production-closure run ID for the exact approved release
        required: true
        type: string
      operation:
        description: Deploy candidate or perform a closure-bound break-glass prior-bundle restore
        required: true
        default: deploy
        type: choice
        options: [deploy, restore-prior-bundle]
      prior_deployment_run_id:
        description: Failed production-deploy run containing the unfinished rollback (restore only)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: industrial-shadow-production-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0

jobs:
  deploy-closure-bound-release:
    environment: production-deployment
    runs-on: [self-hosted, industrial-shadow-deployment]
    timeout-minutes: 60
    env:
      PYTHONPATH: backend/src
      SHADOW_KUBERNETES_CONTEXT: ${{ vars.SHADOW_KUBERNETES_CONTEXT }}
      SHADOW_PRODUCTION_DEPLOYMENT_PLAN: docs/evidence/batch-24/production-deployment/deployment-plan.json
      SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256: ${{ vars.SHADOW_ASSESSOR_TRUST_ROOT_KEY_SHA256 }}
    steps:
      - name: Validate the exact operation input contract
        env:
          OPERATION: ${{ inputs.operation }}
          PRIOR_DEPLOYMENT_RUN_ID: ${{ inputs.prior_deployment_run_id }}
        working-directory: ${{ github.workspace }}
        run: |
          case "$OPERATION" in
            deploy)
              test -z "$PRIOR_DEPLOYMENT_RUN_ID"
              ;;
            restore-prior-bundle)
              [[ "$PRIOR_DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              ;;
            *)
              exit 2
              ;;
          esac
      - name: Resolve the exact closure run and immutable artifact
        id: closure-run
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_RUN_ID: ${{ inputs.closure_run_id }}
        working-directory: ${{ github.workspace }}
        run: |
          [[ "$CLOSURE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_record="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/actions/runs/$CLOSURE_RUN_ID" --jq '[.conclusion,.head_sha,.path,.head_repository.full_name,.event,.run_attempt,.run_started_at,.updated_at] | @tsv')"
          IFS=$'\t' read -r conclusion source_revision workflow_path source_repository event run_attempt run_started_at run_updated_at <<< "$run_record"
          test "$conclusion" = success
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]]
          test "${workflow_path%%@*}" = .github/workflows/production-closure.yml
          test "$source_repository" = "$GITHUB_REPOSITORY"
          test "$event" = workflow_dispatch
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          artifact_expected_name="production-closure-evidence-$CLOSURE_RUN_ID-$run_attempt"
          artifact_record="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/actions/runs/$CLOSURE_RUN_ID/artifacts?name=$artifact_expected_name&per_page=100" --jq '[.total_count,(.artifacts | length),.artifacts[0].id,.artifacts[0].name,.artifacts[0].expired,.artifacts[0].created_at,.artifacts[0].workflow_run.id,.artifacts[0].workflow_run.head_sha,.artifacts[0].digest] | @tsv')"
          IFS=$'\t' read -r artifact_total artifact_count artifact_id artifact_name artifact_expired artifact_created_at artifact_run_id artifact_head_sha artifact_digest <<< "$artifact_record"
          test "$artifact_total" = 1
          test "$artifact_count" = 1
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          test "$artifact_name" = "$artifact_expected_name"
          test "$artifact_expired" = false
          test "$artifact_run_id" = "$CLOSURE_RUN_ID"
          test "$artifact_head_sha" = "$source_revision"
          [[ "$artifact_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 - "$run_started_at" "$run_updated_at" "$artifact_created_at" <<'PY'
          import datetime as dt
          import sys

          started, completed, created = (
              dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              for value in sys.argv[1:]
          )
          if any(value.tzinfo is None for value in (started, completed, created)):
              raise SystemExit("closure artifact timestamps must be timezone-aware")
          if not started <= created <= completed:
              raise SystemExit("closure artifact does not belong to the latest run attempt")
          PY
          echo "run_id=$CLOSURE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${artifact_digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_expected_name" >> "$GITHUB_OUTPUT"
      - name: Inspect exact closure before selecting verifier source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.closure-run.outputs.artifact_name }}
          path: ${{ runner.temp }}/industrial-shadow-closure-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.closure-run.outputs.run_id }}
      - name: Bind deployment source to the signed release candidate
        id: closure-source
        env:
          CANDIDATE_MANIFEST: ${{ runner.temp }}/industrial-shadow-closure-${{ github.run_id }}-${{ github.run_attempt }}/production/supply-chain/release-candidate.json
          EXPECTED_SOURCE_REVISION: ${{ steps.closure-run.outputs.source_revision }}
        working-directory: ${{ github.workspace }}
        run: |
          source_revision="$(python3 - "$CANDIDATE_MANIFEST" "$EXPECTED_SOURCE_REVISION" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          candidate = json.load(open(sys.argv[1]))
          expected_source_revision = sys.argv[2]
          payload = {**candidate, "manifest_digest": ""}
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          if (
              candidate.get("manifest_digest") != hashlib.sha256(encoded.encode()).hexdigest()
              or candidate.get("repository") != os.environ["GITHUB_REPOSITORY"]
              or not re.fullmatch(r"[1-9][0-9]*", str(candidate.get("release_run_id", "")))
              or isinstance(candidate.get("release_run_attempt"), bool)
              or not isinstance(candidate.get("release_run_attempt"), int)
              or candidate.get("release_run_attempt") < 1
              or candidate.get("source_revision") != expected_source_revision
          ):
              raise SystemExit("candidate manifest digest is invalid")
          print(candidate["source_revision"])
          PY
          )"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]]
          test "$source_revision" = "$EXPECTED_SOURCE_REVISION"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.closure-source.outputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Install release verifier dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Download the exact signed closure and deployment plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.closure-run.outputs.artifact_name }}
          path: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/docs/evidence/batch-24
          github-token: ${{ github.token }}
          run-id: ${{ steps.closure-run.outputs.run_id }}
      - name: Verify the failed deployment selected for break-glass restore
        if: inputs.operation == 'restore-prior-bundle'
        id: prior-run
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_DEPLOYMENT_RUN_ID: ${{ inputs.prior_deployment_run_id }}
        run: |
          [[ "$PRIOR_DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$PRIOR_DEPLOYMENT_RUN_ID" != "$GITHUB_RUN_ID"
          run_record="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_DEPLOYMENT_RUN_ID" --jq '[.conclusion,.head_sha,.path,.head_repository.full_name,.event,.run_attempt,.run_started_at,.updated_at] | @tsv')"
          IFS=$'\t' read -r conclusion workflow_source_revision workflow_path source_repository event run_attempt run_started_at run_updated_at <<< "$run_record"
          case "$conclusion" in failure|cancelled) ;; *) exit 1 ;; esac
          [[ "$workflow_source_revision" =~ ^[a-f0-9]{40}$ ]]
          test "${workflow_path%%@*}" = .github/workflows/production-deploy.yml
          test "$source_repository" = "$GITHUB_REPOSITORY"
          test "$event" = workflow_dispatch
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          artifact_name="production-deployment-evidence-$PRIOR_DEPLOYMENT_RUN_ID-$run_attempt"
          artifact_record="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_DEPLOYMENT_RUN_ID/artifacts?name=$artifact_name&per_page=100" --jq '[.total_count,(.artifacts | length),.artifacts[0].id,.artifacts[0].name,.artifacts[0].expired,.artifacts[0].created_at,.artifacts[0].workflow_run.id,.artifacts[0].workflow_run.head_sha,.artifacts[0].digest] | @tsv')"
          IFS=$'\t' read -r artifact_total artifact_count artifact_id observed_name artifact_expired artifact_created_at artifact_run_id artifact_head_sha artifact_digest <<< "$artifact_record"
          test "$artifact_total" = 1
          test "$artifact_count" = 1
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          test "$observed_name" = "$artifact_name"
          test "$artifact_expired" = false
          test "$artifact_run_id" = "$PRIOR_DEPLOYMENT_RUN_ID"
          test "$artifact_head_sha" = "$workflow_source_revision"
          [[ "$artifact_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 - "$run_started_at" "$run_updated_at" "$artifact_created_at" <<'PY'
          import datetime as dt
          import sys

          started, completed, created = (
              dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              for value in sys.argv[1:]
          )
          if any(value.tzinfo is None for value in (started, completed, created)):
              raise SystemExit("prior artifact timestamps must be timezone-aware")
          if not started <= created <= completed:
              raise SystemExit("prior artifact does not belong to the latest run attempt")
          PY
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${artifact_digest#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Download exact prior deployment evidence
        if: inputs.operation == 'restore-prior-bundle'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-deployment-evidence-${{ inputs.prior_deployment_run_id }}-${{ steps.prior-run.outputs.run_attempt }}
          path: ${{ runner.temp }}/industrial-shadow-prior-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prior_deployment_run_id }}
      - name: Verify closure and publish the phased Kubernetes manifests
        if: inputs.operation == 'deploy'
        env:
          SHADOW_PRODUCTION_DEPLOYMENT_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_DEPLOYMENT_CONFIRMATION }}
          SHADOW_PRODUCTION_CLOSURE_RUN_ID: ${{ steps.closure-run.outputs.run_id }}
          SHADOW_PRODUCTION_CLOSURE_RUN_ATTEMPT: ${{ steps.closure-run.outputs.run_attempt }}
          SHADOW_PRODUCTION_CLOSURE_ARTIFACT_ID: ${{ steps.closure-run.outputs.artifact_id }}
          SHADOW_PRODUCTION_CLOSURE_ARTIFACT_SHA256: ${{ steps.closure-run.outputs.artifact_sha256 }}
          SHADOW_PRODUCTION_SOURCE_REVISION: ${{ steps.closure-run.outputs.source_revision }}
        run: |
          python tools/deploy_production_kubernetes.py \
            --plan "$SHADOW_PRODUCTION_DEPLOYMENT_PLAN" \
            --binding docs/evidence/batch-24/production-deployment/deployment-binding.json \
            --recovery-envelope docs/evidence/batch-24/production-deployment/deployment-recovery-envelope.json \
            --execution-envelope docs/evidence/batch-24/production-deployment/deployment-execution-envelope.json \
            --journal docs/evidence/batch-24/production-deployment/deployment-journal.json \
            --output docs/evidence/batch-24/production-deployment/deployment-evidence.json
      - name: Recover an interrupted mutation in this workflow attempt
        if: inputs.operation == 'deploy' && (failure() || cancelled())
        timeout-minutes: 30
        env:
          SHADOW_PRODUCTION_ROLLBACK_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_ROLLBACK_CONFIRMATION }}
          SHADOW_PRODUCTION_CLOSURE_RUN_ID: ${{ steps.closure-run.outputs.run_id }}
          SHADOW_PRODUCTION_CLOSURE_RUN_ATTEMPT: ${{ steps.closure-run.outputs.run_attempt }}
          SHADOW_PRODUCTION_CLOSURE_ARTIFACT_ID: ${{ steps.closure-run.outputs.artifact_id }}
          SHADOW_PRODUCTION_CLOSURE_ARTIFACT_SHA256: ${{ steps.closure-run.outputs.artifact_sha256 }}
          SHADOW_PRODUCTION_SOURCE_REVISION: ${{ steps.closure-run.outputs.source_revision }}
        run: |
          if test ! -e docs/evidence/batch-24/production-deployment/deployment-binding.json \
            && test ! -L docs/evidence/batch-24/production-deployment/deployment-binding.json \
            && test ! -e docs/evidence/batch-24/production-deployment/deployment-recovery-envelope.json \
            && test ! -L docs/evidence/batch-24/production-deployment/deployment-recovery-envelope.json \
            && test ! -e docs/evidence/batch-24/production-deployment/deployment-journal.json \
            && test ! -L docs/evidence/batch-24/production-deployment/deployment-journal.json; then
            echo 'No deployment activation record exists; no Kubernetes mutation was authorized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -f docs/evidence/batch-24/production-deployment/deployment-binding.json
          test -f docs/evidence/batch-24/production-deployment/deployment-recovery-envelope.json
          test -f docs/evidence/batch-24/production-deployment/deployment-journal.json
          python tools/deploy_production_kubernetes.py \
            --same-run-rollback \
            --plan "$SHADOW_PRODUCTION_DEPLOYMENT_PLAN" \
            --prior-binding docs/evidence/batch-24/production-deployment/deployment-binding.json \
            --prior-recovery-envelope docs/evidence/batch-24/production-deployment/deployment-recovery-envelope.json \
            --prior-journal docs/evidence/batch-24/production-deployment/deployment-journal.json \
            --binding docs/evidence/batch-24/production-deployment/same-run-rollback-binding.json \
            --recovery-envelope docs/evidence/batch-24/production-deployment/same-run-rollback-recovery-envelope.json \
            --execution-envelope docs/evidence/batch-24/production-deployment/same-run-rollback-execution-envelope.json \
            --journal docs/evidence/batch-24/production-deployment/same-run-rollback-journal.json \
            --output docs/evidence/batch-24/production-deployment/same-run-rollback-evidence.json
      - name: Break-glass restore the exact closure-bound prior bundle
        if: inputs.operation == 'restore-prior-bundle'
        env:
          SHADOW_PRODUCTION_ROLLBACK_CONFIRMATION: ${{ secrets.SHADOW_PRODUCTION_ROLLBACK_CONFIRMATION }}
          SHADOW_PRODUCTION_CLOSURE_RUN_ID: ${{ steps.closure-run.outputs.run_id }}
          SHADOW_PRODUCTION_CLOSURE_RUN_ATTEMPT: ${{ steps.closure-run.outputs.run_attempt }}
          SHADOW_PRODUCTION_CLOSURE_ARTIFACT_ID: ${{ steps.closure-run.outputs.artifact_id }}
          SHADOW_PRODUCTION_CLOSURE_ARTIFACT_SHA256: ${{ steps.closure-run.outputs.artifact_sha256 }}
          SHADOW_PRODUCTION_SOURCE_REVISION: ${{ steps.closure-run.outputs.source_revision }}
          PRIOR_CONCLUSION: ${{ steps.prior-run.outputs.conclusion }}
        run: |
          prior_completion=()
          if test "$PRIOR_CONCLUSION" = failure; then
            prior_completion+=(
              --prior-envelope "${{ runner.temp }}/industrial-shadow-prior-deployment-${{ github.run_id }}-${{ github.run_attempt }}/deployment-execution-envelope.json"
              --prior-evidence "${{ runner.temp }}/industrial-shadow-prior-deployment-${{ github.run_id }}-${{ github.run_attempt }}/deployment-evidence.json"
            )
          fi
          python tools/deploy_production_kubernetes.py \
            --break-glass-restore \
            --plan "$SHADOW_PRODUCTION_DEPLOYMENT_PLAN" \
            --prior-binding "${{ runner.temp }}/industrial-shadow-prior-deployment-${{ github.run_id }}-${{ github.run_attempt }}/deployment-binding.json" \
            --prior-recovery-envelope "${{ runner.temp }}/industrial-shadow-prior-deployment-${{ github.run_id }}-${{ github.run_attempt }}/deployment-recovery-envelope.json" \
            --prior-journal "${{ runner.temp }}/industrial-shadow-prior-deployment-${{ github.run_id }}-${{ github.run_attempt }}/deployment-journal.json" \
            --prior-conclusion "$PRIOR_CONCLUSION" \
            --prior-deployment-run-id "${{ inputs.prior_deployment_run_id }}" \
            --prior-deployment-run-attempt "${{ steps.prior-run.outputs.run_attempt }}" \
            --prior-deployment-artifact-id "${{ steps.prior-run.outputs.artifact_id }}" \
            --prior-deployment-artifact-sha256 "${{ steps.prior-run.outputs.artifact_sha256 }}" \
            --binding docs/evidence/batch-24/production-deployment/prior-bundle-restore-binding.json \
            --recovery-envelope docs/evidence/batch-24/production-deployment/prior-bundle-restore-recovery-envelope.json \
            --execution-envelope docs/evidence/batch-24/production-deployment/prior-bundle-restore-execution-envelope.json \
            --journal docs/evidence/batch-24/production-deployment/prior-bundle-restore-journal.json \
            --output docs/evidence/batch-24/production-deployment/prior-bundle-restore-evidence.json \
            "${prior_completion[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/docs/evidence/batch-24/production-deployment
          if-no-files-found: error
          retention-days: 90
