# Generated root entrypoint; edit the package template and sync deliberately.
# Template: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/.github/workflows/ci.yml
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: shadow_test
          POSTGRES_USER: shadow_test
          POSTGRES_PASSWORD: shadow_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shadow_test -d shadow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      COVERAGE_CORE: sysmon
      PYTHONPATH: backend/src:services/simulator/src:services/collector/src:services/edge-gateway/src
      SHADOW_TEST_POSTGRESQL_URL: postgresql+psycopg://shadow_test:shadow_test_password@127.0.0.1:5432/shadow_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/backend/requirements.lock
      - name: Validate repository-visible workflow entrypoints
        run: python tools/check_root_workflow_sync.py
      - name: Install hash-locked dependency graph
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Python dependency vulnerability policy
        run: make python-audit
      - name: Unit and contract tests
        run: python -m pytest --cov=shadow_sandbox --cov=shadow_simulator --cov=shadow_collector --cov=shadow_edge --cov-report=xml --junitxml=backend-tests.xml
      - name: PostgreSQL migration and isolation test
        run: make postgres-test
      - name: Package and implementation contracts
        run: make validate
      - name: OpenAPI and schema drift
        run: |
          make schemas
          make client-contract
          git diff --exit-code -- schemas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-evidence
          path: |
            skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/backend-tests.xml
            skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/coverage.xml
            skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/schemas/api/openapi.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/web/package-lock.json
      - name: Install locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Install pinned browser runtime
        run: npm exec -- playwright install --with-deps chromium
      - name: Persona and accessibility browser tests
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Dependency vulnerability policy
        run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: |
            skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/web/dist
            skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/web/test-results/playwright.json
          if-no-files-found: error

  container-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Validate Compose and network boundaries
        env:
          SHADOW_DEV_DB_PASSWORD: ci-database-password
          SHADOW_INTERNAL_SERVICE_TOKEN: ci-internal-token-00000000000000000000000000000000
          SHADOW_SIMULATOR_BUILD_DIGEST: ${{ github.sha }}
          SHADOW_SIMULATOR_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SHADOW_SIMULATOR_CERTIFICATE_FINGERPRINT: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          SHADOW_NODE_ALLOWLIST: '[]'
          SHADOW_TRUSTED_RUN_CONTEXT: '{}'
        run: docker compose -f deploy/compose/compose.yaml config --quiet
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0
          file: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/deploy/compose/Dockerfile.backend
          load: true
          push: false
          tags: industrial-shadow/backend:ci
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0
          file: skills/Industrial_Shadow_Sandbox_Skills_Package_v1.0.0/deploy/compose/Dockerfile.web
          load: true
          push: false
          tags: industrial-shadow/web:ci
      - name: Exercise hardened container runtimes
        run: >-
          python tools/validate_container_runtime.py
          --backend-image industrial-shadow/backend:ci
          --web-image industrial-shadow/web:ci
